<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073fbd">
  <meta name="description" content="Modulos NFC Business Control Panel & Dashboard">
  <title>Modulos | NFC Business Dashboard</title>
  <style>
    :root {
      --blue:#0647cf; --blue-dark:#062d83; --ink:#101828; --muted:#667085;
      --pale:#f4f7ff; --line:#e6ebf5; --white:#fff; --radius:20px;
      --shadow:0 18px 55px rgba(11,44,112,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--pale);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
    
    .auth-card, .dashboard-card {
      background: var(--white);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--line);
    }
    
    .brand {display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:750;letter-spacing:-1px;margin-bottom:28px;color:var(--ink)}
    .brand img {width:42px;height:42px;object-fit:contain;border-radius:12px}

    .form-group {margin-bottom:20px}
    .form-group label {display:block;font-size:13px;font-weight:650;margin-bottom:8px;color:#344054}
    .form-control {width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;font-size:14px;outline:none;transition:.2s}
    .form-control:focus {border-color:var(--blue);box-shadow:0 0 0 3px #0647cf15}

    .btn {width:100%;padding:13px;border:0;border-radius:12px;background:var(--blue);color:white;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
    .btn:hover {background:#0339ae}
    
    .extra-links {display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:15px}
    .extra-links a {color:var(--blue);text-decoration:none;font-weight:600}
    .extra-links a:hover {text-decoration:underline}

    #dashboardScreen {display: none; max-width: 900px;}
    .dashboard-header {display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px;}
    .logout-btn {background: #fee4e2; color: #b42318; width: auto; padding: 8px 16px; border-radius: 8px;}
    .logout-btn:hover {background: #fecdca;}

    .alert {padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 15px; display: none;}
    .alert-error {background: #fee4e2; color: #b42318;}
    .alert-success {background: #ecfdf3; color: #027a48;}
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="auth-card" id="loginScreen">
    <div class="brand">
      <img src="/modulos.logo.png" alt="Modulos Logo"> modulos
    </div>
    
    <div id="authAlert" class="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@modulos.in" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Secure Login <span>↗</span></button>
      
      <div class="extra-links">
        <a href="#" onclick="handleForgotPassword(event)">Forgot Password?</a>
        <span style="color: var(--muted); font-size: 12px;">NFC Panel v1.0</span>
      </div>
    </form>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div class="dashboard-card" id="dashboardScreen">
    <div class="dashboard-header">
      <div class="brand" style="margin:0;">
        <img src="/modulos.logo.png" alt="Modulos Logo"> NFC Admin Panel
      </div>
      <button class="btn logout-btn" onclick="handleLogout()">Logout</button>
    </div>
    
    <div id="dashboardContent">
      <h2>Welcome to your Dashboard! 🎉</h2>
      <p style="color: var(--muted);">Aapka secure session active hai. Aap yahan apna NFC data manage kar sakte hain.</p>
    </div>
  </div>

  <!-- FIREBASE SCRIPT WITH YOUR CONFIG -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBL32KwCkJqSe2KBAO1sbuWLl83s4Cn8lo",
      authDomain: "modulos-3d5de.firebaseapp.com",
      databaseURL: "https://modulos-3d5de-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "modulos-3d5de",
      storageBucket: "modulos-3d5de.firebasestorage.app",
      messagingSenderId: "803636782488",
      appId: "1:803636782488:web:736eef934ac4c08ee177ed",
      measurementId: "G-79YXV1JXY5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const authAlert = document.getElementById('authAlert');

    function showAlert(message, type = 'error') {
      authAlert.textContent = message;
      authAlert.className = `alert alert-${type}`;
      authAlert.style.display = 'block';
    }

    window.handleLogin = function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => {
          showAlert("Login Failed: " + error.message);
        });
    }

    window.handleForgotPassword = function(e) {
      e.preventDefault();
      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();

      if (!email) {
        emailInput.focus();
        showAlert("Pehle apna email box mein enter karein, phir 'Forgot Password' par click karein.", "error");
        return;
      }

      sendPasswordResetEmail(auth, email)
        .then(() => {
          showAlert("Password reset link aapke email par bhej diya gaya hai! Apna inbox check karein.", "success");
        })
        .catch((error) => {
          showAlert("Error: " + error.message, "error");
        });
    }

    window.handleLogout = function() {
      signOut(auth).catch((error) => console.log(error));
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.style.display = 'none';
        dashboardScreen.style.display = 'block';
      } else {
        loginScreen.style.display = 'block';
        dashboardScreen.style.display = 'none';
      }
    });
  </script>
</body>
</html>
