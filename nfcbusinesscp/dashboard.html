<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulos | Business Dashboard</title>
  
  <!-- SECURITY SCRIPT: Agar user logged in nahi hoga toh index.html par redirect kar dega -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBL32KwCkJqSe2KBAO1sbuWLl83s4Cn8lo",
      authDomain: "modulos-3d5de.firebaseapp.com",
      databaseURL: "https://modulos-3d5de-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "modulos-3d5de",
      storageBucket: "modulos-3d5de.firebasestorage.app",
      messagingSenderId: "803636782488",
      appId: "1:803636782488:web:736eef934ac4c08ee177ed",
      measurementId: "G-79YXV1JXY5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Guard Check
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Bina login kiye aane par wapas login page par bhej dega
        window.location.href = "index.html";
      }
    });

    // Logout Function
    window.handleLogout = function() {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    }
  </script>
</head>
<body>
  <!-- Yahan aapka dashboard ka baaki HTML aur UI rahega -->
  <div style="padding: 20px;">
    <h1>Welcome to Dashboard</h1>
    <button onclick="handleLogout()">Logout</button>
  </div>
</body>
</html>
